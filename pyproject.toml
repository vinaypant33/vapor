[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vapor-lang"
version = "1.0.0"
description = "Vapor: a small, basic scripting language written in Python"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Vinay Pant" }]

[project.scripts]
vapor = "vapor.cli:main"

[tool.setuptools]
packages = ["vapor"]
